name: "Build with CMake"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  Build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build .

      - name: Build
        run: cmake --build build
